<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reinos de Azeroth</title>
<style>
:root{
  --bg:#0f0b07; --panel:#1a130c; --panel2:#241a10; --line:#4a3620;
  --gold:#f0c060; --gold2:#d4a017; --txt:#e8dcc8; --dim:#a89878;
  --blue:#3b82f6; --red:#ef4444; --green:#4ade80; --warn:#fbbf24; --bad:#f87171;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #2a1d0f 0%, transparent 60%),
    linear-gradient(#0f0b07, #0a0705 60%, #0d0906);
  color:var(--txt); min-height:100vh;
  font-family:Georgia,"Times New Roman",serif;
}
.hidden{display:none!important}
.screen{min-height:100vh; display:flex; flex-direction:column; align-items:center}
button{font-family:inherit}
input{font-family:inherit}

/* ---------- portal ---------- */
#screenPortal{justify-content:center; padding:24px 16px; background:linear-gradient(rgba(8,5,4,.5),rgba(8,5,4,.82)), url(img/portal.jpg) center/cover no-repeat}
.portalBox{
  width:100%; max-width:430px; background:linear-gradient(rgba(33,23,9,.8),rgba(23,15,8,.8)); backdrop-filter:blur(6px);
  border:2px solid var(--gold2); border-radius:14px; padding:26px 22px 24px;
  box-shadow:0 0 40px rgba(212,160,23,.15), inset 0 0 22px rgba(0,0,0,.5);
}
.logo{font-size:30px; text-align:center; color:var(--gold); letter-spacing:2px; text-shadow:0 2px 0 #000, 0 0 18px rgba(240,192,96,.45); margin:2px 0 6px}
.logoSub{text-align:center; color:var(--dim); font-size:13px; margin:0 0 18px; font-style:italic}
.ptabs{display:flex; gap:8px; margin-bottom:16px}
.ptabs button{flex:1; padding:9px; background:#0f0a06; border:1px solid var(--line); color:var(--dim); border-radius:8px; cursor:pointer; font-size:14px}
.ptabs button.on{background:var(--gold2); color:#1a1206; border-color:var(--gold); font-weight:bold}
form{display:flex; flex-direction:column; gap:10px}
input{padding:10px 12px; background:#0c0805; border:1px solid var(--line); border-radius:7px; color:var(--txt); font-size:14px}
input:focus{outline:none; border-color:var(--gold2)}
.facLabel{color:var(--dim); font-size:13px; margin-top:2px}
.facRow{display:flex; gap:8px}
.facRow button{flex:1; padding:10px; background:#0f0a06; border:1px solid var(--line); border-radius:8px; color:var(--dim); cursor:pointer; font-size:14px}
.facRow button.on[data-fac=alianza]{background:var(--blue); color:#fff; border-color:#93c5fd}
.facRow button.on[data-fac=horda]{background:var(--red); color:#fff; border-color:#fca5a5}
.btn{padding:11px; background:linear-gradient(#f0c060,#d4a017); color:#1a1206; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}
.btn.sm{padding:6px 10px; font-size:12px; background:rgba(42,30,18,.14); backdrop-filter:blur(3px); color:var(--txt); border:1px solid var(--line)}
.btn.sm:hover{border-color:var(--gold2)}
.notice{font-size:13px; min-height:16px; color:var(--dim); text-align:center}
.notice.danger{color:var(--bad)}
.notice.ok{color:var(--green)}

/* ---------- juego ---------- */
#screenGame{align-items:stretch; padding:14px; max-width:920px; margin:0 auto; width:100%}
.hudTop{position:relative; overflow:hidden; border:1px solid var(--line); border-radius:14px; margin-bottom:14px; padding:14px 14px 10px; min-height:250px; display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 8px 22px rgba(0,0,0,.45)}
.hudTop .hudImg{position:absolute; inset:0; background:url(img/header_alianza.jpg) center/cover no-repeat; z-index:0}
.hudTop.fac-horda .hudImg{background-image:url(img/header_horda.jpg)}
.hudTop .hudShade{position:absolute; inset:0; background:linear-gradient(180deg,rgba(8,6,3,.45) 0%,rgba(8,6,3,.12) 38%,rgba(8,6,3,.78) 100%); z-index:1}
.hudTop > *:not(.hudImg):not(.hudShade){position:relative; z-index:2}
.top{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.realmName{font-size:22px; color:var(--gold); text-shadow:0 1px 0 #000}
.facBadge{font-size:12px; padding:3px 9px; border-radius:20px; color:#fff; margin-left:8px; vertical-align:middle}
.facBadge.alianza{background:var(--blue)} .facBadge.horda{background:var(--red)}
.topR{display:flex; gap:8px; align-items:center}
.pts{color:var(--dim); font-size:13px}
.pts b{color:var(--gold)}
.online{color:#7fe08a; font-size:13px; white-space:nowrap}
.resBar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.res{flex:1; min-width:120px; background:linear-gradient(rgba(36,26,16,.62),rgba(26,18,9,.62)); backdrop-filter:blur(3px); border:1px solid var(--line); border-radius:9px; padding:9px 11px; display:flex; align-items:center; gap:8px}
.ri{font-size:19px}
.rv{font-size:16px; font-weight:bold; color:var(--gold); font-variant-numeric:tabular-nums}
.rh{margin-left:auto; font-size:11px; color:var(--green)}
.res.cap .rv{color:var(--dim); font-size:14px}
.queueBox{background:#14100a; border:1px solid var(--gold2); border-radius:9px; padding:10px 12px; margin-bottom:12px}
.qLabel{font-size:14px; margin-bottom:6px}
.qBar{height:10px; background:#0c0805; border-radius:6px; overflow:hidden; border:1px solid var(--line)}
.qFill{height:100%; width:0%; background:linear-gradient(90deg,var(--gold2),var(--gold)); transition:width .4s linear}
.qTime{text-align:right; font-size:12px; color:var(--dim); margin-top:5px; font-variant-numeric:tabular-nums}
.qRow+.qRow{margin-top:10px; padding-top:10px; border-top:1px solid var(--line)}
.gameTabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap}
.gameTabs button{flex:1; min-width:110px; padding:9px; background:rgba(18,12,7,.12); backdrop-filter:blur(3px); border:1px solid var(--line); color:var(--dim); border-radius:8px; cursor:pointer; font-size:14px}
.gameTabs button:hover{border-color:var(--gold2); color:var(--txt)}
.gameTabs button.on{background:rgba(212,160,23,.88); color:#1a1206; border-color:var(--gold); font-weight:bold}
main{flex:1}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:10px}
.card{background:linear-gradient(#211709,#170f08); border:1px solid var(--line); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:10px}
.cardTop{display:flex; gap:10px; align-items:flex-start}
.emoji{font-size:26px; line-height:1}
.troopImg{width:120px; height:auto; border-radius:8px; border:1px solid var(--line); display:block}
.card.hasPic{padding:0; gap:0; overflow:hidden; flex-direction:row; align-items:stretch}
.card.hasPic .picBody{flex:1; min-width:0; padding:12px; display:flex; flex-direction:column; gap:10px}
.card.hasPic .picSide{flex:0 0 120px; align-self:stretch}
.card.hasPic .troopImg{width:100%; height:100%; border:0; border-radius:0; object-fit:cover; object-position:center}
.bName{font-size:15px; font-weight:bold; color:var(--txt)}
.lvl{color:var(--gold); font-size:12px; margin-left:5px}
.bDesc{font-size:12px; color:var(--dim); margin-top:3px}
.cardBot{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-top:auto}
.costs{display:flex; gap:9px; flex-wrap:wrap; font-size:12px}
.costs .c{color:var(--dim); font-variant-numeric:tabular-nums}
.costs .c.no{color:var(--bad); font-weight:bold}
.troopQty{font-size:13px; color:var(--gold)}
.lockTag{font-size:11px; color:#e0a24a; border:1px solid #6b4d22; border-radius:20px; padding:2px 8px; margin-left:6px; white-space:nowrap; vertical-align:middle}
.card.locked{opacity:.55; filter:grayscale(.35)}
.troopRow{display:flex; gap:8px; align-items:center}
.troopRow input{width:78px; padding:7px 9px}
.empty{text-align:center; color:var(--dim); padding:26px 10px}
table.rank{width:100%; border-collapse:collapse; font-size:14px}
table.rank th{background:#241a10; color:var(--dim); font-size:12px; text-align:left; padding:8px}
table.rank td{padding:9px 8px; border-bottom:1px solid #2a1e12}
table.rank tr.me td{background:rgba(240,192,96,.08); color:var(--gold)}
.rankFac{font-size:11px; padding:2px 7px; border-radius:12px; color:#fff}
.acctBox{width:100%; max-width:430px; background:linear-gradient(#211709,#170f08); border:2px solid var(--gold2); border-radius:12px; padding:22px}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#2a1e12; border:1px solid var(--gold2); color:var(--gold); padding:11px 18px; border-radius:9px; font-size:14px; box-shadow:0 6px 22px rgba(0,0,0,.5); z-index:50}
.toast.bad{border-color:var(--bad); color:var(--bad)}
.allyBadge{font-size:11px; padding:3px 8px; border-radius:20px; color:var(--gold); border:1px solid var(--gold2); margin-left:6px; vertical-align:middle}

/* ---------- mapa ---------- */
.mapGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:6px}
.tile{aspect-ratio:1; border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:1px solid var(--line); padding:4px; text-align:center; overflow:hidden}
.tile.empty{background:radial-gradient(circle at 50% 30%, #1d160d, #120d07); opacity:.55; font-size:20px}
.tile.realm{cursor:pointer; position:relative}
.tile.realm.alianza{background:linear-gradient(160deg,#16305a,#0e1e3a); border-color:#3b6fb5}
.tile.realm.horda{background:linear-gradient(160deg,#5a1a1a,#3a0f0f); border-color:#b53b3b}
.tile.realm.me{box-shadow:0 0 0 2px var(--gold), 0 0 14px rgba(240,192,96,.5)}
.tEmoji{font-size:20px; line-height:1}
.tName{font-size:10px; color:var(--txt); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tTag{font-size:9px; color:var(--gold)}
.mapHint{color:var(--dim); font-size:12px; margin-bottom:10px; font-style:italic}

/* ---------- alianza ---------- */
.allyBox{background:linear-gradient(#211709,#170f08); border:1px solid var(--line); border-radius:10px; padding:16px}
.allyHead{font-size:20px; color:var(--gold); margin-bottom:6px}
.allyTagBig{font-size:13px; padding:2px 8px; border-radius:12px; border:1px solid var(--gold2); margin-right:6px}
.allyDesc{color:var(--dim); font-size:13px; margin:4px 0 12px; font-style:italic}
.secTitle{color:var(--gold); font-size:14px; margin:14px 0 8px; border-bottom:1px solid var(--line); padding-bottom:4px}
.members{display:flex; flex-direction:column; gap:5px}
.mem{background:#150f09; border:1px solid var(--line); border-radius:7px; padding:7px 10px; font-size:14px; display:flex; align-items:center; gap:7px}
.mem.me{border-color:var(--gold2)}
.memPts{margin-left:auto; color:var(--gold); font-size:12px}
.chatBox{background:#0c0805; border:1px solid var(--line); border-radius:8px; height:230px; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:6px}
.cmsg{font-size:13px; line-height:1.3; color:var(--txt); word-wrap:break-word}
.cmsg .cwho{color:var(--gold); font-weight:bold}
.cmsg .ctime{color:var(--dim); font-size:10px; margin-left:4px}
.cmsg.me .cwho{color:var(--green)}
.chatRow{display:flex; gap:8px; margin-top:8px}
.chatRow input{flex:1}
.btn.danger{background:linear-gradient(#b53b3b,#8a2323); color:#fff}
.allyCreate{display:flex; flex-direction:column; gap:9px; max-width:420px}
.allyList{display:flex; flex-direction:column; gap:7px; margin-top:6px}
.allyCard{background:#150f09; border:1px solid var(--line); border-radius:8px; padding:10px 12px; display:flex; align-items:center; gap:10px}
.allyCard .info{flex:1}
.allyCard .t{font-size:15px; color:var(--txt)}
.allyCard .m{font-size:12px; color:var(--dim)}
.warsBox{display:flex; flex-direction:column; gap:8px}
.warCard{background:#150f09; border:1px solid var(--line); border-radius:8px; padding:9px 12px}
.warCard.mine{border-color:#b53b3b; box-shadow:0 0 12px rgba(181,59,59,.22)}
.warCard .warSide{font-size:13px; color:var(--txt)}
.warCard .warSide.r{text-align:right}
.warScore{text-align:center; color:var(--gold); font-size:18px; font-weight:bold; letter-spacing:2px; margin:2px 0}
.warDecl{display:flex; gap:8px; margin-top:6px}
.warDecl select{flex:1}
.secSub{font-size:12px; color:var(--gold); text-transform:uppercase; letter-spacing:1px; margin:10px 0 4px; opacity:.85}
.pactCard{background:#0f130f; border:1px solid #2f5a34; border-radius:8px; padding:8px 12px; display:flex; flex-direction:column; gap:4px}
.pactCard .pactWho{font-size:13px; color:var(--txt)}
.pactCard .pactMeta{font-size:11px; color:var(--dim)}
.pactCard button{align-self:flex-start}
.embBox{display:flex;flex-direction:column;gap:6px}
.embGrid{display:flex;flex-wrap:wrap;gap:4px}
.embBtn{background:#0f130f;border:1px solid #2f5a34;border-radius:8px;font-size:18px;line-height:1;padding:6px 8px;cursor:pointer;opacity:.72}
.embBtn:hover{opacity:1}
.embBtn.on{border-color:var(--gold);opacity:1}
.embBtn:disabled{cursor:default}
.mktGrid{display:flex;flex-direction:column;gap:4px}
.mktPrice{display:flex;align-items:center;gap:5px;background:#0f130f;border:1px solid #2f5a34;border-radius:8px;padding:4px 8px;font-size:12px}
.mktPrice.off{border-color:#333;opacity:.6}
.mktPrice .mpName{flex:1;min-width:96px}
.mktPrice input{width:74px;padding:3px 5px;font-size:12px;text-align:center}
.mktPrice .mpDash{color:var(--dim)}
.mktPrice .mpState{width:58px;text-align:right;font-size:11px;color:var(--dim)}
.mktPrice.off .mpState{color:#a55}
.allyRank{display:flex; flex-direction:column; gap:5px}
.rankRow{display:flex; align-items:center; gap:8px; background:#150f09; border:1px solid var(--line); border-radius:7px; padding:6px 10px; font-size:13px}
.rankRow.mine{border-color:var(--gold2)}
.rankPos{width:20px; text-align:center; color:var(--gold); font-weight:bold}
.rankTag{color:var(--gold)}
.rankName{flex:1; color:var(--txt); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rankStat{color:var(--dim); font-size:12px; white-space:nowrap}

/* ---------- ataques / militar ---------- */
.milBox{display:flex; flex-direction:column; gap:9px}
.fleet{background:linear-gradient(#211709,#170f08); border:1px solid var(--line); border-radius:9px; padding:10px 12px; display:flex; align-items:center; gap:10px}
.fleet.in{border-color:#b53b3b; box-shadow:0 0 14px rgba(181,59,59,.25)}
.fleet .fi{font-size:22px; line-height:1}
.fleet .fmain{flex:1; min-width:0}
.fleet .ft{font-size:14px; color:var(--txt)}
.fleet .fd{font-size:12px; color:var(--dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fleet .fcount{color:var(--gold); font-weight:bold; font-variant-numeric:tabular-nums; white-space:nowrap}
.fleet.mkRow{align-items:flex-start; flex-wrap:wrap}
.fleet.mkRow .fd{white-space:normal; overflow:visible; text-overflow:clip; word-break:break-word; line-height:1.35}
.fleet.mkRow .fcount{margin-left:auto}
.rep{background:#150f09; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:13px; margin-bottom:7px}
.rep.win{border-left:4px solid var(--green)}
.rep.lose{border-left:4px solid var(--bad)}
.rep .rl{color:var(--dim); font-size:12px; margin-top:3px}
.btl{margin-top:6px; padding:7px 9px; background:#0f0a06; border:1px solid #2a1e12; border-radius:7px; font-size:12px; color:var(--dim)}
.btlTop{color:var(--txt); margin-bottom:3px}
.btlTop b{color:var(--gold)}
.btlSide{line-height:1.5}
.btlD{margin-top:5px}
.btlD summary{cursor:pointer; color:var(--gold); font-size:12px}
.rnd{display:flex; gap:8px; flex-wrap:wrap; justify-content:space-between; padding:3px 0; border-bottom:1px solid #241a10; font-variant-numeric:tabular-nums}
.rnd:last-child{border-bottom:0}
.btl.btlWin{border-left:3px solid var(--green)}
.btl.btlLose{border-left:3px solid var(--bad)}
.btlHead{color:var(--txt); font-weight:bold; margin-bottom:7px}
.btlVs{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.btlS{flex:1; background:#140f09; border:1px solid #2a1e12; border-radius:7px; padding:6px 8px; text-align:center}
.btlS .btlLbl{display:block; font-size:11px; color:var(--dim)}
.btlS .btlN{display:block; font-size:18px; color:var(--gold); font-variant-numeric:tabular-nums}
.btlS .btlD2{display:block; font-size:10px; color:var(--dim)}
.btlS.atk{border-color:#5a3a1e}
.btlS.def{border-color:#2a3a5a}
.btlVor{color:var(--dim); font-size:11px; font-weight:bold}
.btlTbl{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
.btlTbl th{text-align:left; font-size:11px; color:var(--dim); padding:3px 4px; border-bottom:1px solid #241a10}
.btlTbl td{padding:3px 4px; border-bottom:1px solid #1c150d}
.btlTbl .btlT{color:var(--dim)}
.btlQ{color:var(--green)}
.btlL{color:var(--bad); font-size:11px}
.btlTot td{border-top:1px solid #2a1e12; color:var(--txt)}
.btlFoot{margin-top:7px}
.rndR{color:var(--gold); min-width:58px}
.atkRow{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid #2a1e12}
.atkRow .an{flex:1; font-size:14px}
.atkRow .amax{color:var(--dim); font-size:12px}
.atkRow input{width:86px; padding:7px 9px}

/* ---------- mercado ---------- */
.mktPub{display:flex; flex-direction:column; gap:10px; background:#150f09; border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:6px}
.mktPub label{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); flex-wrap:wrap}
.mktPub select,.mktPub input{padding:8px 9px; border-radius:8px; background:#0f0b06; color:var(--txt); border:1px solid var(--line)}
.mktPub input{width:96px}

/* ---------- modal ---------- */
.modalWrap{position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; padding:18px; z-index:60}
.modalBox{background:linear-gradient(#211709,#170f08); border:2px solid var(--gold2); border-radius:12px; padding:20px; width:100%; max-width:400px; max-height:88vh; overflow-y:auto}
.profRow{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #2a1e12; font-size:14px}
.profRow .k{color:var(--dim)}
.profRow .v{color:var(--gold)}
@media(max-width:520px){ .rv{font-size:15px} .res{min-width:calc(50% - 4px)} .mapGrid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))} }

/* ---------- panel de gestion (admin) ---------- */
.admList{display:flex; flex-direction:column; gap:10px}
.admRow{background:linear-gradient(#211709,#170f08); border:1px solid var(--line); border-radius:10px; padding:11px}
.admRow.banned{opacity:.72; border-color:var(--bad)}
.admHead{display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:15px}
.admHead b{color:var(--gold)}
.admId{color:var(--dim); font-size:12px}
.admFac{margin-left:auto; font-size:12px; color:var(--dim)}
.admTag{font-size:10px; font-weight:bold; padding:2px 6px; border-radius:5px; background:var(--gold2); color:#1a1206}
.admTag.ban{background:var(--bad); color:#1a0606}
.admStats{font-size:12px; color:var(--dim); margin-top:5px; font-variant-numeric:tabular-nums}
.admActs{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.btn.sm.danger{border-color:var(--bad); color:var(--bad)}
.btn.sm.danger:hover{border-color:var(--bad); background:#2a1414}
.admInputs{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
.admInputs label{flex:1; min-width:110px; font-size:12px; color:var(--dim); display:flex; flex-direction:column; gap:5px}
.admInputs input,.admInputs select{width:100%}

/* ---------- mapa 3D ---------- */
.map3d{position:relative; height:min(84vh,800px); min-height:560px; margin:8px 0; border-radius:16px; overflow:hidden;
  background:radial-gradient(90% 70% at 50% 6%, #24354e 0%, #131d2b 46%, #06090f 100%);
  border:1px solid var(--line); touch-action:none; cursor:grab; user-select:none;
  perspective:1800px; perspective-origin:50% 44%; box-shadow:0 0 50px rgba(0,0,0,.55) inset;}
.map3d.grab{cursor:grabbing}
.map3d .stars{position:absolute; inset:0; opacity:.75; pointer-events:none;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 22%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.2px 1.2px at 68% 14%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.2px 1.2px at 34% 62%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.4px 1.4px at 84% 52%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.2px 1.2px at 52% 38%, rgba(255,255,255,.45), transparent),
    radial-gradient(1.2px 1.2px at 22% 84%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.2px 1.2px at 90% 82%, rgba(255,255,255,.4), transparent);}
.m3stage{position:absolute; left:50%; top:60%; width:0; height:0; transform-style:preserve-3d;
  transform:scale(var(--scale,1)) rotateX(var(--tilt,56deg)) rotateZ(var(--rotz,0deg));}
.m3ground{position:absolute; left:0; top:0; width:1560px; height:1420px; margin:-710px 0 0 -780px; border-radius:50%;
  background:
    repeating-radial-gradient(circle at 50% 50%, rgba(150,205,140,.05) 0 2px, transparent 2px 52px),
    radial-gradient(closest-side, #3a5733 0%, #2b4a23 48%, #1c3018 76%, #101d10 100%);
  box-shadow:0 0 0 5px rgba(90,140,85,.16), 0 0 130px rgba(0,0,0,.9) inset;}
.m3shore{position:absolute; left:0; top:0; width:1620px; height:1480px; margin:-740px 0 0 -810px; border-radius:50%;
  border:24px solid rgba(28,52,74,.7); box-shadow:0 0 70px rgba(0,0,0,.6);}
.m3dshadow{position:absolute; left:0; top:0; width:48px; height:20px; margin:-10px 0 0 -24px; border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.45), transparent 72%);}
.m3deco{position:absolute; left:0; bottom:0; transform-origin:50% 100%; pointer-events:none;
  transform:scale(var(--s,1)) rotateZ(calc(-1 * var(--rotz,0deg))) rotateX(calc(-1 * var(--tilt,56deg)));}
.m3deco .e{display:block; font-size:34px; line-height:1; filter:drop-shadow(0 5px 4px rgba(0,0,0,.6));}
.m3stand{position:absolute; left:0; top:0; transform-style:preserve-3d; transform:translate3d(var(--x),var(--y),0);}
.m3shadow{position:absolute; left:0; top:0; width:76px; height:32px; margin:-16px 0 0 -38px; border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.6), transparent 72%);}
.m3shadow.central{width:210px; height:90px; margin:-45px 0 0 -105px;
  background:radial-gradient(ellipse at 50% 50%, rgba(240,192,96,.4), rgba(0,0,0,.45) 55%, transparent 76%);}
.m3bill{position:absolute; left:0; bottom:0; width:104px; height:126px; margin-left:-52px; transform-origin:50% 100%;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end; cursor:pointer;
  transform:rotateZ(calc(-1 * var(--rotz,0deg))) rotateX(calc(-1 * var(--tilt,56deg)));}
.m3castle{font-size:56px; line-height:1; filter:drop-shadow(0 7px 6px rgba(0,0,0,.65));}
.m3bill.alianza .m3castle{filter:drop-shadow(0 0 12px rgba(90,160,255,.8)) drop-shadow(0 7px 6px rgba(0,0,0,.65));}
.m3bill.horda .m3castle{filter:drop-shadow(0 0 12px rgba(255,95,95,.8)) drop-shadow(0 7px 6px rgba(0,0,0,.65));}
.m3bill.empty .m3castle{font-size:44px; opacity:.4; filter:grayscale(1) drop-shadow(0 6px 5px rgba(0,0,0,.5));}
.m3bill:hover{filter:brightness(1.2)}
.m3bill.me .m3name{color:#0d180f; background:linear-gradient(#f0c060,#d4a017); font-weight:bold}
.m3name{font-size:12px; color:var(--gold); background:rgba(10,7,4,.78); padding:2px 7px; border-radius:6px; margin-top:3px;
  max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.m3tag{font-size:10px; color:var(--dim); margin-top:1px}
/* castillo central (imponente) */
.m3bill.central{width:280px; height:290px; margin-left:-140px; cursor:default}
.m3bill.central .m3castle{font-size:158px;
  filter:drop-shadow(0 0 30px rgba(240,192,96,.8)) drop-shadow(0 16px 14px rgba(0,0,0,.75));}
.m3bill.central .m3name{font-size:15px; color:var(--gold); letter-spacing:2px; background:rgba(10,7,4,.85)}
.mapHint3d{position:absolute; left:12px; right:12px; bottom:10px; text-align:center; font-size:12px;
  color:var(--dim); pointer-events:none; text-shadow:0 1px 3px #000}

/* ---------- mapa (imagen pergamino) ---------- */
.mapWrap{position:relative; margin:8px 0; overflow:auto; max-height:78vh; -webkit-overflow-scrolling:touch}
.mapBar{display:flex; align-items:center; gap:10px; margin:6px 0 0}
.mapHint{font-size:12px; color:var(--dim)}
.mapInner{position:relative; display:block; width:200%; border-radius:16px; overflow:hidden;
  border:1px solid var(--line); box-shadow:0 16px 46px rgba(0,0,0,.6)}
.mapImg{display:block; width:100%; height:auto; max-width:none; max-height:none}
.mPin{position:absolute; transform:translate(-50%,-100%); text-align:center; cursor:pointer; z-index:2}
.mPin.empty{opacity:.5; pointer-events:none}
.mPin .mPinCastle{font-size:24px; line-height:1; filter:drop-shadow(0 2px 2px rgba(0,0,0,.85))}
.mPin .mPinName{display:inline-block; font-size:11px; font-weight:700; color:#f4e4c1; background:rgba(20,12,6,.8);
  border:1px solid var(--line); border-radius:6px; padding:0 5px; margin-top:1px; white-space:nowrap;
  max-width:140px; overflow:hidden; text-overflow:ellipsis}
.mPin.alianza .mPinCastle{filter:drop-shadow(0 0 4px #5aa0ff) drop-shadow(0 2px 2px rgba(0,0,0,.85))}
.mPin.horda .mPinCastle{filter:drop-shadow(0 0 4px #ff5f5f) drop-shadow(0 2px 2px rgba(0,0,0,.85))}
.mPin.me .mPinName{color:#0d180f; background:linear-gradient(#f0c060,#d4a017); border-color:var(--gold)}
.mPinTag{display:block; width:fit-content; margin:1px auto 0; font-size:10px; font-weight:700; color:#f0e2c6; background:rgba(20,12,6,.85);
  border:1px solid var(--line); border-radius:5px; padding:0 4px;
  white-space:nowrap; max-width:140px; overflow:hidden; text-overflow:ellipsis}
.mPin.throne.taken .mPinTag{color:#ffe9a8; border-color:var(--gold2)}
.mPin.aldea.taken .mPinTag{color:#ffe9a8; border-color:var(--gold2)}
.mPin.throne .mPinCastle{font-size:34px; filter:drop-shadow(0 0 10px rgba(240,192,96,.9)) drop-shadow(0 3px 3px rgba(0,0,0,.85))}
.mPin.throne .mPinName{color:#ffe9a8; border-color:var(--gold2); letter-spacing:1px}
.mPin.aldea .mPinCastle{font-size:26px; filter:drop-shadow(0 0 8px rgba(130,200,120,.9)) drop-shadow(0 3px 3px rgba(0,0,0,.85))}
.mPin.aldea .mPinName{color:#d9f0c4; border-color:#7fae5a; letter-spacing:.5px}
.mPin.aldea.taken .mPinCastle{filter:drop-shadow(0 0 8px rgba(240,192,96,.9)) drop-shadow(0 3px 3px rgba(0,0,0,.85))}
.mPin.aldea.taken .mPinName{color:#ffe9a8; border-color:var(--gold2)}
.thrHist{margin-top:4px; max-height:160px; overflow:auto; border:1px solid rgba(240,192,96,.25); border-radius:8px; padding:6px}
.thrEvent{font-size:12px; padding:3px 2px; border-bottom:1px solid rgba(255,255,255,.06)}
.thrEvent:last-child{border-bottom:none}
.cronica{margin-top:12px; border:1px solid rgba(240,192,96,.25); border-radius:10px; padding:8px 10px; background:rgba(0,0,0,.25); max-height:190px; overflow:auto}
.cronTitle{color:var(--gold); font-weight:700; margin-bottom:6px; letter-spacing:.5px}
.cronEvent{font-size:12.5px; padding:3px 0; border-bottom:1px solid rgba(255,255,255,.06)}
.cronEvent:last-child{border-bottom:none}
/* ejercitos en movimiento por los caminos */
.armyLayer{position:absolute; inset:0; pointer-events:none; z-index:4}
.mArmy{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:20px; line-height:1;
  will-change:left,top,transform; filter:drop-shadow(0 2px 3px rgba(0,0,0,.9))}
.mArmy.mine{font-size:23px; filter:drop-shadow(0 0 5px rgba(240,192,96,.95)) drop-shadow(0 2px 3px rgba(0,0,0,.9))}
.mArmy.back{font-size:22px; filter:drop-shadow(0 0 5px rgba(90,160,255,.9)) drop-shadow(0 2px 3px rgba(0,0,0,.9))}
.mArmy.spy{font-size:17px; opacity:.9; filter:drop-shadow(0 0 5px rgba(150,110,220,.95)) drop-shadow(0 2px 3px rgba(0,0,0,.9))}
.mArmy.fx{font-size:27px; z-index:5; filter:drop-shadow(0 0 9px rgba(240,192,96,1)) drop-shadow(0 2px 3px rgba(0,0,0,.9))}
.mArmy.fx.back{font-size:25px; filter:drop-shadow(0 0 9px rgba(90,160,255,1)) drop-shadow(0 2px 3px rgba(0,0,0,.9))}
@media(max-width:520px){
  .mPin .mPinCastle{font-size:18px}
  .mPin .mPinName{font-size:9px; max-width:92px}
  .mPin .mPinTag{font-size:9px; max-width:92px}
  .mPin.throne .mPinCastle{font-size:26px}
  .mPin.aldea .mPinCastle{font-size:20px}
  .mArmy{font-size:16px}
  .mArmy.mine{font-size:19px}
  .mArmy.back{font-size:18px}
  .mArmy.spy{font-size:14px}
}
</style>
</head>
<body>

<!-- ============ PORTAL ============ -->
<div id="screenPortal" class="screen hidden">
  <div class="portalBox">
    <div class="logo">⚔️ REINOS DE AZEROTH</div>
    <p class="logoSub">Construye tu reino, entrena tu ejército, conquista el ranking.</p>
    <div class="ptabs">
      <button id="tabLogin" class="on">Entrar</button>
      <button id="tabReg">Crear reino</button>
    </div>

    <form id="formLogin">
      <input id="liName" placeholder="Nombre del rey" autocomplete="username">
      <input id="liPass" type="password" placeholder="Contraseña" autocomplete="current-password">
      <button class="btn">Entrar al reino</button>
      <div id="liMsg" class="notice"></div>
    </form>

    <form id="formReg" class="hidden">
      <input id="rgName" placeholder="Nombre del rey" autocomplete="username">
      <input id="rgRealm" placeholder="Nombre del reino" autocomplete="off">
      <input id="rgPass" type="password" placeholder="Contraseña" autocomplete="new-password">
      <input id="rgPass2" type="password" placeholder="Repite la contraseña">
      <div class="facLabel">Elige tu bando:</div>
      <div class="facRow">
        <button type="button" class="fac" data-fac="alianza">🛡️ Alianza</button>
        <button type="button" class="fac" data-fac="horda">⚔️ Horda</button>
      </div>
      <button class="btn">Crear mi reino</button>
      <div id="rgMsg" class="notice"></div>
    </form>
  </div>
</div>

<!-- ============ JUEGO ============ -->
<div id="screenGame" class="screen hidden">
  <div class="hudTop">
  <div class="hudImg"></div><div class="hudShade"></div>
  <div class="top">
    <div><span class="realmName" id="gName"></span><span class="facBadge" id="gFac"></span><span class="allyBadge" id="gAlly"></span></div>
    <div class="topR">
      <span class="online" id="gOnline">🟢 0 en línea</span>
      <span class="pts">Puntos: <b id="gPts">0</b></span>
      <button class="btn sm" id="btnAcct">👤 Cuenta</button>
      <button class="btn sm" id="btnLogout">Salir</button>
    </div>
  </div>

  <div class="resBar">
    <div class="res"><span class="ri">💰</span><span class="rv" id="rGold">0</span><span class="rh" id="rGoldH"></span></div>
    <div class="res"><span class="ri">🪵</span><span class="rv" id="rWood">0</span><span class="rh" id="rWoodH"></span></div>
    <div class="res"><span class="ri">⛏️</span><span class="rv" id="rOre">0</span><span class="rh" id="rOreH"></span></div>
    <div class="res"><span class="ri">🧿</span><span class="rv" id="rCup">0</span><span class="rh" id="rCupH"></span></div>
    <div class="res cap"><span class="ri">📦</span><span class="rv" id="rCap">0</span></div>
  </div>

  <div id="queueBox" class="queueBox hidden"></div>

  <nav class="gameTabs">
    <button data-tab="bld" class="on">🏰 Edificios</button>
    <button data-tab="troop">⚔️ Tropas</button>
    <button data-tab="map">🗺️ Mapa</button>
    <button data-tab="mil">🗡️ Ataques</button>
    <button data-tab="ally">🤝 Alianza</button>
    <button data-tab="chat">💬 Chat</button>
    <button data-tab="rank">🏆 Ranking</button>
    <button data-tab="market">🛒 Mercado</button>
    <button data-tab="admin" id="tabBtnAdmin" class="hidden">🛡️ Gestión</button>
  </nav>
  </div>

  <main>
    <section id="tabBld" class="tabpane"></section>
    <section id="tabTroop" class="tabpane hidden"></section>
    <section id="tabMap" class="tabpane hidden"></section>
    <section id="tabMil" class="tabpane hidden"></section>
    <section id="tabAlly" class="tabpane hidden"></section>
    <section id="tabChat" class="tabpane hidden"></section>
    <section id="tabRank" class="tabpane hidden"></section>
    <section id="tabMarket" class="tabpane hidden"></section>
    <section id="tabAdmin" class="tabpane hidden"></section>
  </main>

  <div id="toast" class="toast hidden"></div>
</div>

<!-- ============ CUENTA ============ -->
<div id="screenAcct" class="screen hidden">
  <div class="acctBox">
    <h2 style="margin-top:0;color:var(--gold)">👤 Mi reino</h2>
    <p id="acctInfo" style="color:var(--dim)"></p>
    <form id="formPw">
      <input id="pw1" type="password" placeholder="Nueva contraseña" autocomplete="new-password">
      <input id="pw2" type="password" placeholder="Repite la contraseña">
      <button class="btn">Cambiar contraseña</button>
      <div id="pwMsg" class="notice"></div>
    </form>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn sm" id="btnBack" style="flex:1">⬅ Volver al reino</button>
      <button class="btn sm" id="btnLogout2" style="flex:1">Cerrar sesión</button>
    </div>
  </div>
</div>

<!-- ============ PERFIL (modal) ============ -->
<div id="modal" class="modalWrap hidden">
  <div class="modalBox" id="modalBox"></div>
</div>
